# Actions are pinned to full commit hashes (supply-chain safety); the comment shows the
# version. Dependabot proposes updates as pull requests.
# No gradle/actions: since v6 its caching is a proprietary component. setup-java's own
# cache does the job. Reproducible-build jobs and releases build without cache.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog check compares against the previous commit

      - name: Changelog updated?
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/changelog.sh check-updated "$BASE" HEAD

      - name: Verify Gradle wrapper
        run: scripts/verify-gradle-wrapper.sh

      - name: Script tests
        run: python3 -m unittest discover scripts

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test, lint and build debug APK
        run: ./gradlew test lintDebug assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buerstli-debug
          path: app/build/outputs/apk/debug/*.apk

  # F-Droid ships our own signed APK only if its build matches ours byte for byte. Build the
  # release in two different environments (JDK vendor and version, checkout path) and compare,
  # so a dependency update that breaks reproducibility is caught right away.
  reproducible:
    name: Reproducible build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: temurin-17
            distribution: temurin
            java: 17
            path: buerstli
          - name: zulu-21-other-path
            distribution: zulu
            java: 21
            path: some/other/place/buerstli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - name: Build unsigned release APK
        working-directory: ${{ matrix.path }}
        run: ./gradlew assembleRelease

      - name: Checksum
        run: sha256sum ${{ matrix.path }}/app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1 | tee hash-${{ matrix.name }}.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

  reproducible-compare:
    name: Reproducible build (compare)
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hash-*
          merge-multiple: true

      - name: Both builds must be identical
        run: |
          grep . hash-*.txt
          [ "$(sort -u hash-*.txt | wc -l)" = 1 ] || { echo "Release builds differ: not reproducible"; exit 1; }
