name: Release

# Push a tag like v0.3.2 to build a signed APK and publish a GitHub release whose notes are
# the matching section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag, app version and changelog agree?
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          scripts/changelog.sh check-release "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Secret KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build signed release APK
        env:
          BUERSTLI_KEYSTORE: ${{ runner.temp }}/release.jks
          BUERSTLI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUERSTLI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUERSTLI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew test lintDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "buerstli-$VERSION.apk"
          sha256sum "buerstli-$VERSION.apk" > "buerstli-$VERSION.apk.sha256"

      - name: Release notes from CHANGELOG.md
        run: |
          {
            scripts/changelog.sh notes "$VERSION"
            echo
            echo "---"
            echo "**Install:** download \`buerstli-$VERSION.apk\` below and open it on your phone."
            echo "If you had a test build installed, uninstall it first (different signature)."
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "buerstli-$VERSION.apk" "buerstli-$VERSION.apk.sha256" \
            --title "Bürstli $VERSION" \
            --notes-file notes.md
