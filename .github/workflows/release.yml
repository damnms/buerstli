name: Release

# Push a tag like v0.1.0 to build a signed APK and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          BUERSTLI_KEYSTORE: ${{ runner.temp }}/release.jks
          BUERSTLI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUERSTLI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUERSTLI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "buerstli-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "buerstli-${GITHUB_REF_NAME}.apk" --generate-notes
